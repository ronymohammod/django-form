{% extends 'master/base.html' %}

{% block body %}
  <h1>Blog List</h1>

  <a href="{% url 'add_blog' %}" class="btn btn-primary">Blog List</a>

  <table class="table table_striped">
    <thead>
      <tr>
        <th>SL</th>
        <th>Title</th>
        <th>Image</th>
        <th>Publisj Date</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      {% for data in blog_data %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ data.title }}</td>
          <td>
            <img src="{{ data.blog_image.url }}" width="50px" alt="" />
          </td>
          <td>{{ data.publish_date }}</td>
          <td>
            <a href="{% url 'update_blog' data.id %}" style="text-decoration: none;">Edit</a>

          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
